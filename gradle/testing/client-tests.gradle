sourceSets {
    clientTest {
        java.srcDir rootProject.file('common/src/clientTest/java')
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath + sourceSets.client.compileClasspath
    }
}

configurations {
    clientTestImplementation.extendsFrom testImplementation
    clientTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('clientTest', Test) {
    group = 'verification'
    description = 'Runs shared client CPU contracts without starting Minecraft or a GPU.'
    testClassesDirs = sourceSets.clientTest.output.classesDirs
    classpath = sourceSets.clientTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.named('check') { dependsOn 'clientTest' }
