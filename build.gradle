plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

layout.buildDirectory = layout.projectDirectory.dir('tests/build')

subprojects {
    apply plugin: 'java-library'
    group = rootProject.group
    version = rootProject.version
    repositories {
        mavenCentral()
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = rootProject.java_version as int
        options.encoding = 'UTF-8'
    }
    tasks.withType(ProcessResources).configureEach {
        def metadata = [
            version: project.version,
            minecraft_version: rootProject.minecraft_version,
            java_version: rootProject.java_version,
            loader_version: rootProject.loader_version,
            fabric_api_version: rootProject.fabric_api_version.split('\\+')[0],
            neoforge_version: rootProject.neoforge_version,
            sodium_compat_version: rootProject.sodium_compat_version,
            iris_compat_version: rootProject.iris_compat_version,
            render_dependency_reason: 'Only the tested version is supported. Install that version or remove this optional mod.'
        ]
        inputs.properties(metadata)
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand metadata
        }
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE.md'))
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    base.archivesName = "Portalix-${project.name}-${rootProject.minecraft_version}"

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '2G'
        testLogging { events 'failed', 'skipped' }
    }
}

apply from: 'gradle/testing/regression.gradle'

tasks.named('build') {
    dependsOn ':common:classes', ':common:clientClasses', ':fabric:build', ':neoforge:build'
}
