def gameTestReportFile = layout.buildDirectory.file('reports/gametest/results.xml')

loom {
    runs {
        regressionServer {
            server()
            source sourceSets.regression
            runDir 'build/run/gametest'
            property 'fabric-api.gametest', 'true'
            rootProject.regressionEnvironmentProperties.each { name, value -> property name, value }
            property 'fabric-api.gametest.filter', rootProject.regressionServerTestFilter
            property 'fabric-api.gametest.report-file', gameTestReportFile.get().asFile.absolutePath
            programArgs '--world', 'world'
            vmArgs '-Xmx4G'
            ideConfigGenerated false
        }
    }
}

def resetGameTestWorld = tasks.register('resetRegressionServerWorld', Delete) {
    delete layout.buildDirectory.dir('run/gametest/world')
}

tasks.named('runRegressionServer') {
    dependsOn resetGameTestWorld
    doFirst {
        def runDirectory = layout.buildDirectory.dir('run/gametest').get().asFile
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').createNewFile()
    }
}

apply from: rootProject.file('gradle/testing/gametest-report.gradle')
