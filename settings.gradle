pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'Portalix'
includeBuild('gradle/testing') { name = 'test-infrastructure' }
include 'common', 'fabric', 'neoforge'
