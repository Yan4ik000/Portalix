pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

def minecraftVersion = providers.gradleProperty('mcVersion').orElse(providers.gradleProperty('default_minecraft_version')).get()
def versionDirectories = new File(settingsDir, 'versions').listFiles().findAll { directory ->
    directory.isDirectory() && new File(directory, 'gradle.properties').isFile()
}
def versionDirectory = versionDirectories.find { it.name == minecraftVersion }
if (versionDirectory == null) {
    def supported = versionDirectories*.name.sort().join(', ')
    throw new GradleException("Unsupported Minecraft version '${minecraftVersion}'. Set -PmcVersion to one of: ${supported}")
}

def cacheDirectory = gradle.startParameter.projectCacheDir?.canonicalFile
if (cacheDirectory == null) {
    throw new GradleException("Use the Portalix Gradle wrapper or set --project-cache-dir to a directory reserved for Minecraft ${minecraftVersion}.")
}
def wrapperCacheRoot = new File(settingsDir, '.gradle/minecraft').canonicalFile
if (cacheDirectory.parentFile == wrapperCacheRoot && cacheDirectory.name != minecraftVersion) {
    throw new GradleException("Project cache '${cacheDirectory}' does not match Minecraft ${minecraftVersion}.")
}

gradle.rootProject { project ->
    project.ext.minecraft_version = minecraftVersion
    project.ext.minecraftSourcesDir = versionDirectory
}

rootProject.name = 'Portalix'
includeBuild('gradle/testing') { name = 'test-infrastructure' }
include 'common', 'fabric', 'neoforge'
