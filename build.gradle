import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

def minecraftVersion = minecraft_version
def versionDirectory = minecraftSourcesDir

def versionProperties = new Properties()
new File(versionDirectory, 'gradle.properties').withReader('UTF-8') { versionProperties.load(it) }
versionProperties.each { name, value -> ext.set(name, providers.gradleProperty(name).getOrElse(value)) }

def addVersionedDirectory = { SourceDirectorySet sources, File common, String path ->
    def versioned = new File(versionDirectory, path)
    sources.srcDirs(common, versioned)
    sources.exclude { entry ->
        !entry.directory && entry.file.toPath().startsWith(common.toPath()) && new File(versioned, entry.path).isFile()
    }
}

ext.addMinecraftSources = { SourceSet sourceSet, String path ->
    def sharedDirectory = file(path)
    def versionedPath = path.replace('/src/', '/')
    addVersionedDirectory(sourceSet.java, sharedDirectory, versionedPath)
    addVersionedDirectory(sourceSet.resources, new File(sharedDirectory, 'resources'), versionedPath + '/resources')
}

layout.buildDirectory = layout.projectDirectory.dir("tests/build/${minecraftVersion}")

subprojects {
    apply plugin: 'java-library'
    group = rootProject.group
    version = rootProject.version
    layout.buildDirectory = layout.projectDirectory.dir("build/${minecraftVersion}")
    sourceSets.configureEach { sourceSet ->
        def versionedPath = "${project.name}/${sourceSet.name}"
        def shared = file("src/${sourceSet.name}")
        sourceSet.java.setSrcDirs([])
        addVersionedDirectory(sourceSet.java, shared, versionedPath)
        sourceSet.java.exclude('resources/**')
        sourceSet.resources.setSrcDirs([])
        addVersionedDirectory(sourceSet.resources, new File(shared, 'resources'), versionedPath + '/resources')
    }
    repositories {
        mavenCentral()
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = rootProject.java_version as int
        options.encoding = 'UTF-8'
    }
    tasks.withType(ProcessResources).configureEach {
        def metadata = [
            version: project.version,
            minecraft_version: rootProject.minecraft_version,
            java_version: rootProject.java_version,
            loader_version: rootProject.loader_version,
            fabric_api_version: rootProject.fabric_api_version.split('\\+')[0],
            neoforge_version: rootProject.neoforge_version,
            sodium_compat_version: rootProject.sodium_compat_version,
            iris_compat_version: rootProject.iris_compat_version,
            render_dependency_reason: 'Only the tested version is supported. Install that version or remove this optional mod.'
        ]
        inputs.properties(metadata)
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand metadata
        }
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE.md'))
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    base.archivesName = "Portalix-${project.name}-${rootProject.minecraft_version}"

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '2G'
        testLogging { events 'failed', 'skipped' }
    }
}

apply from: 'gradle/testing/regression.gradle'

tasks.named('wrapper', Wrapper) {
    def unixLauncher = layout.projectDirectory.file('gradlew').asFile
    def windowsLauncher = layout.projectDirectory.file('gradlew.bat').asFile
    def launcherSource = layout.projectDirectory.file('gradle/wrapper/PortalixGradle.java').asFile

    // Keep the working launchers until both generated scripts have been adapted.
    scriptFile = new File(temporaryDir, unixLauncher.name)
    outputs.files(unixLauncher, windowsLauncher)

    doLast {
        def adaptLauncher = { File generated, String appHome, String pathSeparator, String argumentSeparator ->
            def argument = { File directory, File file ->
                def relative = directory.toPath().relativize(file.toPath()).toString().replace(File.separator, pathSeparator)
                "\"${appHome}${relative}\""
            }
            String original = "-jar ${argument(generated.parentFile, jarFile)}"
            String script = Files.readString(generated.toPath())
            if (script.count(original) != 1) {
                throw new GradleException("Cannot adapt generated wrapper script ${generated.name}: expected one ${original} invocation.")
            }
            String replacement = [
                '--enable-native-access=ALL-UNNAMED',
                "-classpath ${argument(unixLauncher.parentFile, jarFile)}",
                argument(unixLauncher.parentFile, launcherSource)
            ].join(argumentSeparator)
            Files.writeString(generated.toPath(), script.replace(original, replacement))
        }

        adaptLauncher(scriptFile, '$APP_HOME/', '/', " \\\n        ")
        adaptLauncher(batchScript, '%APP_HOME%\\', '\\', ' ')
        Files.copy(scriptFile.toPath(), unixLauncher.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.COPY_ATTRIBUTES)
        // cmd.exe may still be running the batch file during regeneration.
        Files.write(windowsLauncher.toPath(), Files.readAllBytes(batchScript.toPath()))
    }
}

tasks.named('build') {
    dependsOn ':common:classes', ':common:clientClasses', ':fabric:build', ':neoforge:build'
}
