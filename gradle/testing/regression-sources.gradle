buildscript {
    dependencies { classpath 'dev.portalix.build:test-infrastructure:1' }
}

import PrepareRegressionRun
import VerifyRegressionLog

sourceSets {
    test {
        rootProject.addMinecraftSources(sourceSets.test, 'common/src/test')
    }
    regression {
        rootProject.addMinecraftSources(sourceSets.regression, 'tests/src/main')
        rootProject.addMinecraftSources(sourceSets.regression, "tests/${project.name}/main")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    regressionClient {
        rootProject.addMinecraftSources(sourceSets.regressionClient, 'tests/src/client')
        rootProject.addMinecraftSources(sourceSets.regressionClient, "tests/${project.name}/client")
        rootProject.addMinecraftSources(sourceSets.regressionClient, 'tests/src/benchmark')
        rootProject.addMinecraftSources(sourceSets.regressionClient, 'tests/src/compat')
        compileClasspath += sourceSets.regression.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.regression.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

configurations {
    regressionImplementation.extendsFrom implementation
    regressionRuntimeOnly.extendsFrom runtimeOnly
    regressionClientImplementation.extendsFrom clientImplementation, regressionImplementation
    regressionClientCompileOnly.extendsFrom clientCompileOnly
    regressionClientRuntimeOnly.extendsFrom clientRuntimeOnly, regressionRuntimeOnly
}

def profileId = rootProject.regressionProfileId
def profile = rootProject.regressionProfile
ext.regressionRunDirectory = layout.buildDirectory.dir("run/regression/${rootProject.regressionModeDirectory}${profileId}")
ext.regressionReportDirectory = rootProject.layout.buildDirectory.dir("reports/regression/${rootProject.regressionModeDirectory}${profileId}")
ext.benchmarkRunDirectory = layout.buildDirectory.dir("run/benchmarks/${rootProject.regressionModeDirectory}${profileId}")
ext.benchmarkReportDirectory = rootProject.layout.buildDirectory.dir("reports/benchmarks/${rootProject.regressionModeDirectory}${profileId}")

['Regression': false, 'Benchmark': true].each { kind, benchmark ->
    tasks.register("prepare${kind}Client", PrepareRegressionRun) {
        profileName = profileId
        clientTestSelection = benchmark ? rootProject.regressionBenchmarkSelection : rootProject.regressionClientTestSelection
        loaderName = profile.loader
        moduleName = project.name
        backend = profile.backend
        shaders = profile.renderer == 'sodium-iris'
        shaderPackName = rootProject.regressionShaderPack.name
        shaderPackUrl = rootProject.regressionShaderPack.url
        shaderPackHash = rootProject.regressionShaderPack.sha512
        supported = profile.supported
        runDirectory = benchmark ? benchmarkRunDirectory : regressionRunDirectory
        reportDirectory = benchmark ? benchmarkReportDirectory : regressionReportDirectory
        shaderCacheDirectory = rootProject.layout.projectDirectory.dir(".gradle/regression-assets/${rootProject.minecraft_version}")
        minecraftClasspath.from(sourceSets.main.compileClasspath)
    }

    tasks.register("verify${kind}Log", VerifyRegressionLog) {
        profileName = profileId
        loaderName = profile.loader
        moduleName = project.name
        backend = profile.backend
        shaders = profile.renderer == 'sodium-iris'
        supported = profile.supported
        runDirectory = benchmark ? benchmarkRunDirectory : regressionRunDirectory
        reportDirectory = benchmark ? benchmarkReportDirectory : regressionReportDirectory
        mustRunAfter "run${kind}Client"
    }
    tasks.matching { it.name == "run${kind}Client" }.configureEach {
        finalizedBy tasks.named("verify${kind}Log")
    }
}
