def gameTestReportFile = layout.buildDirectory.file('reports/gametest/results.xml')

neoForge {
    runs {
        regressionServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.regression
            gameDirectory = layout.buildDirectory.dir('run/gametest')
            systemProperty 'neoforge.enableGameTest', 'true'
            rootProject.regressionEnvironmentProperties.each { name, value -> systemProperty name, value }
            jvmArgument '-Xmx4G'
            programArguments.addAll('--tests', rootProject.regressionServerTestFilter, '--report',
                gameTestReportFile.get().asFile.absolutePath)
            disableIdeRun()
        }
    }
}

tasks.named('runRegressionServer') {
    mustRunAfter ':fabric:testServer'
}

apply from: rootProject.file('gradle/testing/gametest-report.gradle')
