import java.util.jar.Manifest
import net.fabricmc.loom.util.ZipReprocessorUtil

plugins {
    id 'net.fabricmc.fabric-loom'
}

rootProject.addMinecraftSources(sourceSets.main, 'common/src/main')

loom {
    accessWidenerPath = new File(rootProject.minecraftSourcesDir, 'common/main/resources/portalix.accesswidener')
    splitEnvironmentSourceSets()
    mods {
        portalix {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client { runDir layout.buildDirectory.dir('run/client').get().asFile.absolutePath }
        server { runDir layout.buildDirectory.dir('run/server').get().asFile.absolutePath }
    }
}

rootProject.addMinecraftSources(sourceSets.client, 'common/src/client')
rootProject.addMinecraftSources(sourceSets.client, 'common/src/compat')

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    clientCompileOnly "maven.modrinth:modmenu:${rootProject.modmenu_version}"
    clientCompileOnly "maven.modrinth:sodium:${rootProject.sodium_version}"
    clientCompileOnly "maven.modrinth:iris:${rootProject.iris_version}"
}

tasks.named('jar', Jar) {
    doLast {
        // Loom writes the client-only entries in filesystem order.
        ZipReprocessorUtil.transformZipEntry(archiveFile.get().asFile.toPath(), 'META-INF/MANIFEST.MF') { bytes ->
            def manifest = new Manifest(new ByteArrayInputStream(bytes))
            def attributes = manifest.mainAttributes
            def key = 'Fabric-Loom-Client-Only-Entries'
            def entries = attributes.getValue(key).split(';')
            attributes.putValue(key, entries.sort().join(';'))
            def output = new ByteArrayOutputStream()
            manifest.write(output)
            output.toByteArray()
        }
    }
}

apply from: rootProject.file('gradle/testing/client-tests.gradle')
apply from: rootProject.file('gradle/testing/fabric-regression.gradle')
apply from: rootProject.file('gradle/testing/release-contracts.gradle')
apply from: rootProject.file('gradle/testing/packaged-regression.gradle')

apply from: rootProject.file('gradle/signing.gradle')
